name: Energy Cloud A/B Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-cloud-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          scope: runtime
          electron: "true"

      - name: Run paired Electron CPU proxy benchmark
        shell: bash
        run: |
          xvfb-run -a ./apps/desktop/node_modules/.bin/electron --no-sandbox \
            .github/scripts/energy-cloud-probe.cjs 5 20000 2>&1 | tee energy-cloud-probe.log
          node .github/scripts/verify-energy-cloud-probe.cjs energy-cloud-probe.log 5 20000

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-cloud-probe
          path: energy-cloud-probe.log
