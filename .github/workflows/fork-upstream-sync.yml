name: Sync upstream into personal fork

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synara-fork-upstream-sync
  cancel-in-progress: false

env:
  FORK_BRANCH: codex/mobile-remote
  UPSTREAM_REPOSITORY: Emanuele-web04/synara

jobs:
  sync:
    name: Validate and release fork
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the personal fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Resolve the newest stable upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          fi
          release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases?per_page=100" --paginate)"
          tag="$(jq -r '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.published_at) | last | .tag_name // empty' <<<"$release_json")"
          if [[ -z "$tag" ]]; then
            echo "No stable upstream release found."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Upstream release version is not a plain semver: $tag" >&2
            exit 1
          fi
          git fetch --no-tags upstream "refs/tags/${tag}:refs/tags/${tag}"
          upstream_sha="$(git rev-list -n 1 "${tag}^{commit}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_merge=true" >> "$GITHUB_OUTPUT"
          fi
          echo "needs_validation=true" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == false' 2>/dev/null | grep -qx true; then
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the exact upstream release into the fork branch
        if: steps.upstream.outputs.needs_merge == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor "${{ steps.upstream.outputs.sha }}" HEAD; then
            echo "The upstream release is already included in ${FORK_BRANCH}."
          else
            git merge --no-edit --no-ff "${{ steps.upstream.outputs.sha }}"
          fi

      - name: Install dependencies
        if: steps.upstream.outputs.needs_validation == 'true'
        run: |
          # Avoid workspace prepare scripts running effect-tsgo twice on a
          # clean runner. `bun run typecheck` applies the patch once itself.
          bun install --frozen-lockfile --ignore-scripts
          # Marketing's generated `collections/server` module is a workspace
          # postinstall output and is required by the root typecheck.
          bun run --cwd apps/marketing postinstall
          npm ci --prefix extensions/mobile-remote

      - name: Run repository gates and builds
        if: steps.upstream.outputs.needs_validation == 'true'
        env:
          SYNARA_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          bun fmt
          bun lint
          bun typecheck
          bun run build --filter=@synara/web --filter=@synara/cli
          SYNARA_MOBILE_LIVE_TEST=1 node --test extensions/mobile-remote/lib/*.test.mjs

      - name: Publish validated bot commit
        if: steps.upstream.outputs.needs_validation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            git add -u
            git commit -m "chore(upstream): sync ${{ steps.upstream.outputs.tag }}"
          fi
          git push origin "HEAD:${FORK_BRANCH}"

      - name: Require persistent consumer signing secrets before release tag
        if: steps.upstream.outputs.needs_release == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MAC_CERT_P12 MAC_CERT_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing ${name}. Copy the existing TrapRAM signing secret to TrapstarKS/synara before the consumer release can be tagged."
              exit 1
            fi
          done

      - name: Create the fork-only consumer release tag
        if: steps.upstream.outputs.needs_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.upstream.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Fork release tag ${tag} already exists; the release workflow can resume independently."
            exit 0
          fi
          git tag -a "$tag" -m "Synara consumer release $tag" HEAD
          git push origin "refs/tags/${tag}"
